<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Image Mask</title>
  </head>
  <body>
    <div class="el"></div>
    <h1 class="img-text">AHMAD</h1>
    <svg
      viewBox="0 0 600 400"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-label="A filled with image"
    >
      <defs>
        <mask id="text-mask" maskUnits="userSpaceOnUse">
          <!-- white = visible, black = hidden -->
          <rect width="100%" height="100%" fill="black" />
          <text
            x="50%"
            y="60%"
            text-anchor="middle"
            font-family="sans-serif"
            font-size="300"
            font-weight="900"
            fill="white"
          >
            A
          </text>
        </mask>
      </defs>

      <!-- image to be revealed by the text mask -->
      <image
        href="../pexels-souvenirpixels-417074.jpg"
        width="100%"
        height="100%"
        preserveAspectRatio="xMidYMid slice"
        mask="url(#text-mask)"
      />
    </svg>
  </body>
</html>
